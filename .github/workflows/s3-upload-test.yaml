name: S3 Artifact Upload Test

on:
  push:
    branches:
      - s3-download-test

jobs:
  upload-to-s3:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1 # Replace with your desired AWS region

      # Step 3: Create a sample file to upload
      - name: Create sample file
        run: echo "This is a test file for S3 upload" > sample-file.txt

      # Step 4: Add a unique timestamp to the object name
      - name: Generate unique file name
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          UNIQUE_NAME="sample-file-$TIMESTAMP.txt"
          mv sample-file.txt "$UNIQUE_NAME"
          echo "UNIQUE_NAME=$UNIQUE_NAME" >> $GITHUB_ENV

      # Step 5: Upload artifacts to AWS S3
      - name: Upload artifacts to AWS S3
        uses: aws-actions/s3-sync@v2
        with:
          source: .
          destination: s3://prem-github-artifacts/
          region: ap-south-1
          options: --exact-timestamps

      # Step 6: Generate public URL and output
      - name: Generate and output public URL
        run: |
          PUBLIC_URL="https://prem-github-artifacts.s3.ap-south-1.amazonaws.com/$UNIQUE_NAME"
          echo "File uploaded successfully: $PUBLIC_URL"
          echo "PUBLIC_URL=$PUBLIC_URL" >> $GITHUB_ENV
