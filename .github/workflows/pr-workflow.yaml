name: Pull Request Workflow

on:
  pull_request:
    branches:
      - main

jobs:
  self-hosted-job-on-prem-account:
    runs-on: arc-runner-set
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Print message
        run: echo "workflow is running"
        
      - name: Run loop test
        run: |
          echo "Starting loop test"
          START_TIME=$(date +%s)
          for ((i=0; i<1000000; i++)); do
            echo "Iteration $i" > /dev/null
          done
          END_TIME=$(date +%s)
          echo "Loop test completed in $((END_TIME - START_TIME)) seconds"
